  <rect x="570" y="106" width="184" height="110" rx="12" fill="#e9f0eb" stroke="#4e6b56" stroke-width="2"/>
  <text x="662" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#3d5a47">03 · 事件仲裁修正</text>
